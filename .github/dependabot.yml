version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      all-actions:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/rust/spice-bridge"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "rust"
