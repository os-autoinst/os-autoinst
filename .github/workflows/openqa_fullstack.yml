---
name: openQA Fullstack
# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stability_test:
        description: 'Set to 1 to fail if any of the RETRY fails'
        default: 0
env:
  # Set to 1 to temporarily ignore warnings
  PERL_TEST_WARNINGS_ONLY_REPORT_WARNINGS: 0
  OPENQA_FULLSTACK_TEMP_DIR: /tmp/test-results/fullstack
  TEST_USER: testuser

jobs:
  fullstack:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: registry.opensuse.org/devel/openqa/containers/opensuse/openqa_ci:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Create additional user to avoid initdb error "cannot be run as root"
        run: useradd "$TEST_USER"
      - name: Make project folder user-writable
        run: chown -R $TEST_USER ../../os-autoinst
      - name: Clone openQA
        run: sudo -u "$TEST_USER" git clone --depth 1 https://github.com/os-autoinst/openQA.git ../openQA
      - name: Install node modules
        run: sudo -u "$TEST_USER" make -C ../openQA node_modules
      - name: Build os-autoinst
        run: sudo -u "$TEST_USER" make symlinks
      - name: Run unit tests
        run: |
          sudo -u "$TEST_USER" mkdir -p "$OPENQA_FULLSTACK_TEMP_DIR"
          sudo -u "$TEST_USER" make -C ../openQA test-with-database \
            FULLSTACK=1 TIMEOUT_M=30 PROVE_ARGS="t/full-stack.t" \
            OPENQA_FULLSTACK_TEMP_DIR="$OPENQA_FULLSTACK_TEMP_DIR"
        env:
          STABILITY_TEST: ${{ github.event.inputs.stability_test }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: ${{ always() }}
        with:
          name: Test results
          path: |
            /tmp/test-results/
            !/tmp/test-results/**/*.iso
          include-hidden-files: true
