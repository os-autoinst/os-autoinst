---
name: ci extended
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - container/**
jobs:
  test-containers:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Test our container definitions
        run: tools/test_containers
