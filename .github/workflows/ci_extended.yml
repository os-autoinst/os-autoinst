---
name: ci extended
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - container/**
jobs:
  test-containers:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Test our container definitions
        run: tools/test_containers
